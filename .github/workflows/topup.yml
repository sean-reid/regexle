name: topup

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: topup
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}
  PUZZLE_SEED: ${{ secrets.PUZZLE_SEED }}

jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: top up puzzles
        run: |
          if [ -z "$PUZZLE_SEED" ]; then
            echo "::error::PUZZLE_SEED is not set in Actions secrets; no puzzles can be generated"
            exit 1
          fi
          node scripts/topup.ts --remote
